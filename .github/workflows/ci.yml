name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build StudentRegistration.slnx --nologo
      # Includes integration tests (Testcontainers spins up MySQL 8; runners provide Docker)
      - run: dotnet test StudentRegistration.slnx --nologo --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json
      - uses: browser-actions/setup-chrome@v1
      - run: npm ci
      - run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox
      - run: npx ng build --configuration production
