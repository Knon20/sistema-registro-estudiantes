services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: student-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng_Passw0rd!"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Str0ng_Passw0rd!' -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/API/Dockerfile
    container_name: student-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=StudentDb;User Id=sa;Password=Str0ng_Passw0rd!;TrustServerCertificate=True;"
    ports:
      - "5000:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./src/Frontend
      dockerfile: Dockerfile
    container_name: student-frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  sqldata:
