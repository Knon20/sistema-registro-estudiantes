services:
  mysql:
    image: mysql:8.0
    container_name: student-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "Str0ng_Passw0rd!"
      MYSQL_DATABASE: "StudentDb"
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pStr0ng_Passw0rd!"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/API/Dockerfile
    container_name: student-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__Default: "Server=mysql;Database=StudentDb;User=root;Password=Str0ng_Passw0rd!;"
    ports:
      - "5000:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./src/Frontend
      dockerfile: Dockerfile
    container_name: student-frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  mysqldata:
