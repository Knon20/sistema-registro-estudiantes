<header class="topbar">
  <a routerLink="/students" class="brand">
    <span class="logo">SR</span>
    <h1>{{ title }}</h1>
  </a>
  <nav>
    <a routerLink="/students" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">Estudiantes</a>
    <a routerLink="/students/new" routerLinkActive="active">Nuevo</a>
    <a routerLink="/classmates" routerLinkActive="active">Compañeros</a>
  </nav>
  <button class="theme-toggle" (click)="theme.toggle()" [attr.aria-label]="theme.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'" [title]="theme.theme() === 'dark' ? 'Modo claro' : 'Modo oscuro'">
    <svg *ngIf="theme.theme() === 'dark'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg *ngIf="theme.theme() === 'light'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>
<main class="layout">
  <router-outlet />
</main>
<app-confirm-dialog />
<footer class="foot">Clean Architecture · .NET 8 + Angular 17</footer>
